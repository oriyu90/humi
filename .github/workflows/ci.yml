name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # macos-15 ships an Xcode 16 toolchain (Swift 6.x); macos-14's default is
    # Swift 5.10, which can't read this package's swift-tools-version:6.0 manifest.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Swift version
        run: swift --version

      - name: Build (default config — must not break on the test target)
        run: swift build

      - name: Release build
        run: swift build -c release --product Humi

      - name: Self-tests
        run: bash Scripts/test.sh

      - name: Assemble Humi.app
        run: bash Scripts/build-app.sh release

      - name: Verify bundle
        run: |
          test -x dist/Humi.app/Contents/MacOS/Humi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Humi.app/Contents/Info.plist
          codesign --verify --verbose dist/Humi.app
